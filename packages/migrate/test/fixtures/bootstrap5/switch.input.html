<div class="form-group">
    <label for="toggle-{{property}}" class="col-sm-3 control-label">{{t label}}</label>
    <div class="col-sm-6">
        <div class="checkbox checkbox-slider-primary checkbox-slider checkbox-slider--b checkbox-slider-md">
            <label>
                <input id="toggle-{{property}}" {{#unless noForm2js}}name="{{property}}"{{/unless}} type="checkbox" {{#if enabled}}checked{{/if}} value="true"><span></span>
            </label>
        </div>
    </div>
</div>
<div class="checkbox checkbox-slider-primary checkbox-slider checkbox-slider--b checkbox-slider-md">
    <label>
        <input class="toggleBoolean advancedMappingParam"
            id="{{this.name}}"
            type="checkbox"
            name="{{this.name}}">
        <span></span>
    </label>
</div>
<div class="checkbox checkbox-slider checkbox-slider-md checkbox-slider--b-flat checkbox-slider-primary active-control">
    <label><input name="{{name}}" type="checkbox" {{#if value}}checked{{/if}} ><span></span></label>
</div>
<div class="checkbox checkbox-slider checkbox-slider--b">
    <label><input type="checkbox" name="remember"><span>Remember me</span></label>
</div>
<div class="checkbox checkbox-slider-primary checkbox-slider checkbox-slider--b checkbox-slider-md">
    <label>
        <input type="checkbox" name="defaultDashboard" id="DefaultDashboard"/><span></span>
    </label>
    <span class="help-block">{{t "dashboard.new.defaultDesc"}}</span>
</div>
<div class="checkbox checkbox-slider checkbox-slider-md checkbox-slider--b-flat checkbox-slider-primary">
    <label>
        <input type="checkbox" id="oathStatus" {{#if authNeeded}} checked {{/if}}>
        <span></span> {{!-- This span is required by titatoggle, for adding styles.  --}}
    </label>
</div>
<div class="checkbox checkbox-slider-primary checkbox-slider checkbox-slider--b checkbox-slider-md">
{{#if canDisable}}
    <label>
        <input id="enabled" name="enabled" type="checkbox" {{#if enabled}}checked{{/if}}><span></span>
    </label>
{{else}}
    <p class="text-muted">Can't disable</p>
{{/if}}
</div>
